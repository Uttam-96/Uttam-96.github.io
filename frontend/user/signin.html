

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="../assets/css/signin.css">
  </head>
  <body>
    <!-- Full-screen background image -->
    <div class="background">
      <img src="../assets/images/home_ss.png" alt="Background Image" />
    </div>


    
    <!-- Centered sign-in section -->
    <div class="signin-container">
      <h2>Welcome</h2>
      <p>Sign in with Google to continue</p>
      <button class="google-btn" id="googleSignIn">
        <img src="../assets/images/google-logo.webp" alt="Google Logo" />
        <span>Sign in with Google</span>
      </button>
    </div>
    <script>
    // Redirect to home.html on button click
      document.getElementById('googleSignIn').addEventListener('click', function() {
        // For now, simulate Google sign-in
          window.location.href = 'home.html';
      });
    </script>
  </body>
</html>

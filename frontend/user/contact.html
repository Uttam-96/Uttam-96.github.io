<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/contact.css">
</head>
<body>
      <nav>
      <!-- Left Section: Logo + Parajulillb -->
      <div class="nav-left">
        <img src="../assets/images\logo.jpg" alt="" class="logo" />
        <span class="brand-name">Parajulillb</span>
      </div>

      <!-- Center Section: Navigation Buttons -->
    <div class="nav-center">
      <a href="home.html"><button>Home</button></a>
      <a href="contact.html"><button>Contact</button></a>
    </div>

      <!-- Right Section: Theme Switcher + Get Started -->
      <div class="nav-right">
        <div class="theme-switcher">
          <button onclick="setTheme('light')" aria-label="Light Theme">
            ☀️ 
          </button>
          <button onclick="setTheme('dark')" aria-label="Dark Theme">
            🌙
          </button>
          <button onclick="setTheme('sepia')" aria-label="Sepia Theme">
            📜
          </button>
        </div>
      </div>
    </nav>

     <div class="form-section">
            <h2>Send Message</h2>
            <div class="success-message" id="successMessage">
                Thank you! Your message has been sent successfully.
            </div>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>

<!-- Theme Persistence Script -->
  <script>
    // Apply saved theme on page load
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme") || "light";
      document.body.className = savedTheme; // Apply class to body
    });

    // Function to set theme
    function setTheme(theme) {
      document.body.className = theme;
      localStorage.setItem("theme", theme);
    }
  </script>
</body>
</html>
